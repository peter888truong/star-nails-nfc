<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Nails NFC Employee System</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #eef4ff;
      color: #17365d;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 460px;
      margin: 20px auto;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    h1 {
      color: #1456a0;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #5c6f85;
      margin-bottom: 24px;
    }

    #status {
      background: #f1f5f9;
      border-radius: 10px;
      padding: 14px;
      margin: 18px 0;
      overflow-wrap: anywhere;
    }

    #employee {
      font-size: 23px;
      font-weight: bold;
      margin: 18px 0;
    }

    button {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }

    #scanButton { background: #2563eb; }
    #clockInButton { background: #16803c; }
    #clockOutButton { background: #d97706; }

    button:disabled {
      background: #aab4c3;
      cursor: not-allowed;
    }

    .note {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Star Nails</h1>
    <div class="subtitle">NFC Employee Attendance System</div>

    <button id="scanButton">SCAN NFC CARD</button>

    <div id="status">System is ready. Tap Scan NFC Card to begin.</div>

    <div id="employee">No employee scanned</div>

    <button id="clockInButton" disabled>CLOCK IN</button>
    <button id="clockOutButton" disabled>CLOCK OUT</button>

    <div class="note">
      Scan your employee card first, then choose Clock In or Clock Out.
      Do not tap either attendance button unless you intend to record a time.
    </div>
  </div>

  <script>
    const WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbw-qSLiTKPvcUGmAuUt5t1Xy47l3_PML-OJTFRoIGWXZeBfZcYWgQs1SW34P_0aR-cAsQ/exec';

    const scanButton = document.getElementById('scanButton');
    const clockInButton = document.getElementById('clockInButton');
    const clockOutButton = document.getElementById('clockOutButton');
    const statusBox = document.getElementById('status');
    const employeeBox = document.getElementById('employee');

    let scannedEmployeeId = '';
    let scanning = false;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    scanButton.addEventListener('click', async () => {
      if (scanning) return;

      if (!('NDEFReader' in window)) {
        setStatus('NFC is not supported here. Open this page in Chrome on your phone.');
        return;
      }

      try {
        scanning = true;
        scannedEmployeeId = '';
        clockInButton.disabled = true;
        clockOutButton.disabled = true;
        employeeBox.textContent = 'Waiting for NFC card...';
        setStatus('Hold your employee NFC card near the back of your phone.');

        const ndef = new NDEFReader();

        ndef.onreadingerror = () => {
          setStatus('Could not read this card. Try holding it near the phone again.');
        };
       
  
ndef.onreading = async (event) => {
  const details = [];
  let foundId = '';

  for (const record of event.message.records) {
    try {
const bytes = new Uint8Array(
  record.data.buffer,
  record.data.byteOffset,
  record.data.byteLength
);

      let text = '';

      if (record.recordType === 'text' && bytes.length >= 3) {
        const languageLength = bytes[0] & 0x3f;
        text = new TextDecoder().decode(
          bytes.slice(1 + languageLength)
        ).trim();
      }

      const raw = new TextDecoder().decode(bytes).trim();

      details.push(
        'Type=' + record.recordType +
        ', bytes=' + bytes.length +
        ', raw=' + JSON.stringify(raw) +
        ', text=' + JSON.stringify(text)
      );

      const match = (text + ' ' + raw).match(/\bP\d+\b/i);
      if (match) foundId = match[0].toUpperCase();

    } catch (error) {
      details.push('Read error: ' + error.message);
    }
  }

  if (foundId) {
    scannedEmployeeId = foundId;
    employeeBox.textContent = 'Employee ID: ' + foundId;
    setStatus('Employee ID found. Choose Clock In or Clock Out.');
    clockInButton.disabled = false;
    clockOutButton.disabled = false;
  } else {
    scannedEmployeeId = '';
    employeeBox.textContent = 'Employee ID not identified';
    clockInButton.disabled = true;
    clockOutButton.disabled = true;
    setStatus('NFC data: ' + details.join(' | '));
  }

  scanning = false;
};

        await ndef.scan();
        setStatus('NFC scanning started. Hold your card near the phone.');

      } catch (error) {
        scanning = false;
        setStatus('NFC error: ' + error.message);
      }
    });

    function recordAttendance(action) {
      if (!scannedEmployeeId) {
        setStatus('Please scan your employee card first.');
        return;
      }

      const confirmed = confirm(
        'Record ' + action.toUpperCase() +
        ' for employee ' + scannedEmployeeId + '?'
      );

      if (!confirmed) return;

      setStatus('Sending attendance record...');
      clockInButton.disabled = true;
      clockOutButton.disabled = true;

      const url = WEB_APP_URL +
        '?action=' + encodeURIComponent(action) +
        '&employeeId=' + encodeURIComponent(scannedEmployeeId);

      window.location.href = url;
    }

    clockInButton.addEventListener('click', () => {
      recordAttendance('clockIn');
    });

    clockOutButton.addEventListener('click', () => {
      recordAttendance('clockOut');
    });
  </script>
</body>
</html>
